<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai agent harness</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --line: #2b3038; --fg: #dfe3ea;
    --dim: #8b93a1; --accent: #7cc4ff; --tool: #ffcf70; --ok: #86e39b; --err: #ff8a8a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .meta { color: var(--dim); font-family: var(--mono); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .meta b { color: var(--fg); font-weight: 500; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  textarea {
    width: 100%; min-height: 76px; resize: vertical; padding: 10px;
    background: #101216; color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; font-family: var(--mono); font-size: 13px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin-top: 12px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
  input[type=number] {
    width: 80px; padding: 6px 8px; background: #101216; color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono);
  }
  select {
    max-width: 340px; padding: 5px 8px; background: #101216; color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 12px;
  }
  button {
    padding: 8px 16px; border-radius: 7px; border: 1px solid var(--line);
    background: #232830; color: var(--fg); font: inherit; cursor: pointer;
  }
  button.small { padding: 4px 10px; font-size: 12px; font-family: var(--mono); }
  button.primary { background: #1d4d75; border-color: #2b6d9f; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #log { display: grid; gap: 10px; }
  .ev { border-left: 3px solid var(--line); padding: 8px 12px; background: #16191e; border-radius: 0 8px 8px 0; }
  .ev .tag {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--dim); display: block; margin-bottom: 5px;
  }
  .ev pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: var(--mono); font-size: 13px;
  }
  .ev.step { border-color: #3b4351; }
  .ev.assistant { border-color: var(--accent); }
  .ev.tool { border-color: var(--tool); }
  .ev.tool .tag { color: var(--tool); }
  .ev.observation { border-color: #47515f; }
  .ev.observation pre { color: #b9c1cd; }
  .ev.phase { border-color: #6b5ea8; background: #1a1824; }
  .ev.phase .tag { color: #b3a6ee; }
  .ev.final { border-color: var(--ok); background: #16211a; }
  .ev.final .tag { color: var(--ok); }
  .ev.error { border-color: var(--err); background: #241819; }
  .ev.error .tag { color: var(--err); }
  .idle { color: var(--dim); font-size: 13px; }
  footer { color: var(--dim); font-size: 12px; font-family: var(--mono); text-align: center; padding: 4px 20px 26px; }
</style>
</head>
<body>
<header>
  <h1>Bonsai agent harness</h1>
  <span class="meta">
    model <select id="model-select" title="model to load"></select>
    <button id="switch" class="small" disabled>switch</button>
  </span>
  <span class="meta">
    session <select id="session-select" title="saved sessions"></select>
    <button id="new-session" class="small">new</button>
    <button id="del-session" class="small">delete</button>
  </span>
  <span class="meta">loaded <b id="m-model">…</b></span>
  <span class="meta">workspace <b id="m-ws">…</b></span>
  <span class="meta">tools <b id="m-tools">…</b></span>
</header>

<main>
  <section class="card">
    <textarea id="task" spellcheck="false">List the files in the workspace, then write hello.txt containing two lines of greeting, and tell me what you did.</textarea>
    <div class="row">
      <label>max steps <input id="max-steps" type="number" min="1" max="20" value="6"></label>
      <label>max tokens / step <input id="max-tokens" type="number" min="16" max="2048" value="256"></label>
      <button id="run" class="primary">Run agent</button>
      <button id="stop" disabled>Stop</button>
      <span id="status" class="idle">idle</span>
    </div>
  </section>

  <section class="card">
    <div id="log"><span class="idle">No run yet. The agent loops: model reply → tool call → observation → next turn.</span></div>
  </section>
</main>

<footer id="foot">harness v1.1 · stdlib only · tools confined to the workspace · one model loaded at a time</footer>

<script>
const $ = (id) => document.getElementById(id);
let ctrl = null;
let busy = false;          // a turn or a switch owns the model
let models = [];
let currentSession = null;   // id of the session the log currently shows

const fmtSecs = (s) => s == null ? '?' : (s < 90 ? Math.round(s) + 's' : Math.round(s / 60) + ' min');

// ---- log rendering -----------------------------------------------------
function clearLog() { $('log').innerHTML = ''; }

function addEvent(kind, tag) {
  const box = document.createElement('div');
  box.className = 'ev ' + kind;
  const lab = document.createElement('span');
  lab.className = 'tag';
  lab.textContent = tag;
  const pre = document.createElement('pre');
  box.append(lab, pre);
  $('log').appendChild(box);
  box.scrollIntoView({block: 'nearest'});
  return pre;
}

let streamPre = null;

function handle(ev) {
  switch (ev.type) {
    case 'step':
      streamPre = null;
      addEvent('step', 'step ' + ev.n + ' / ' + ev.of).textContent = 'model turn';
      break;
    case 'assistant_delta':
      if (!streamPre) streamPre = addEvent('assistant', 'assistant (streaming)');
      streamPre.textContent += ev.text;
      break;
    case 'assistant':
      if (streamPre) {
        streamPre.textContent = ev.text || '(empty)';
        streamPre.parentElement.querySelector('.tag').textContent = 'assistant';
        streamPre = null;
      } else {
        addEvent('assistant', 'assistant').textContent = ev.text || '(empty)';
      }
      break;
    case 'tool':
      streamPre = null;
      addEvent('tool', 'tool call · ' + ev.name).textContent = JSON.stringify(ev.args, null, 2);
      break;
    case 'observation':
      addEvent('observation', 'observation · ' + ev.name).textContent = ev.text;
      break;
    case 'final':
      streamPre = null;
      addEvent('final', 'final answer').textContent = ev.text;
      break;
    case 'error':
      streamPre = null;
      addEvent('error', 'error').textContent = ev.message;
      break;
    case 'session':
      currentSession = ev.id;
      $('status').textContent = 'session ' + (ev.title || ev.id);
      break;
  }
}

// ---- sse ---------------------------------------------------------------
async function readSSE(res, onEvent) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        try { onEvent(JSON.parse(line.slice(6))); } catch (e) { console.warn('bad event', line); }
      }
    }
  }
}

// ---- models ------------------------------------------------------------
async function loadModels() {
  const data = await (await fetch('/api/models')).json();
  models = data.models || [];
  const sel = $('model-select');
  const chosen = sel.value;
  sel.innerHTML = '';
  for (const m of models) {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.label + (m.present ? '' : ' — not downloaded');
    o.disabled = !m.present;
    sel.appendChild(o);
  }
  const fallback = data.current || (models.find(m => m.present) || {}).id;
  if (chosen && models.some(m => m.id === chosen && m.present)) sel.value = chosen;
  else if (fallback) sel.value = fallback;

  $('m-model').textContent = data.current
    ? (models.find(m => m.id === data.current) || {}).label + (data.loaded_seconds ? ' (' + fmtSecs(data.loaded_seconds) + ' load)' : '')
    : 'nothing loaded';
  $('switch').disabled = busy || data.switching || !sel.value || sel.value === data.current;
  return data;
}

async function loadInfo() {
  try {
    const info = await (await fetch('/api/info')).json();
    $('m-ws').textContent = info.workspace;
    $('m-tools').textContent = (info.tools || []).join(' ');
    if (!info.ok) $('foot').textContent = 'model server not reachable: ' + info.error;
    else $('foot').textContent = 'harness v1.1 · stdlib only · tools confined to the workspace · one model loaded at a time';
  } catch (err) { $('foot').textContent = 'harness unreachable: ' + err; }
}

function setBusy(state, statusText) {
  busy = state;
  $('run').disabled = state;
  $('stop').disabled = !state || state === 'switch';
  $('model-select').disabled = state;
  $('switch').disabled = state || $('model-select').value === undefined;
  $('session-select').disabled = state;
  $('new-session').disabled = state;
  $('del-session').disabled = state || !$('session-select').value;
  if (statusText) $('status').textContent = statusText;
  if (!state) loadModels().catch(() => {});
}

// ---- sessions ----------------------------------------------------------
const fmtWhen = (ts) => ts ? new Date(ts * 1000).toLocaleString() : '?';

async function loadSessions(preferId) {
  const data = await (await fetch('/api/sessions')).json();
  const sel = $('session-select');
  const keep = preferId || currentSession || sel.value;
  sel.innerHTML = '';
  for (const s of data.sessions || []) {
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = (s.title || '(untitled)') + ' · ' + s.turns + ' turn' + (s.turns === 1 ? '' : 's');
    o.title = 'updated ' + fmtWhen(s.updated) + (s.last_task ? '\n' + s.last_task : '');
    sel.appendChild(o);
  }
  const ids = (data.sessions || []).map(s => s.id);
  if (keep && ids.includes(keep)) sel.value = keep;
  else if (ids.length) sel.value = ids[0];
  else sel.innerHTML = '<option value="">(no saved sessions)</option>';
  $('del-session').disabled = busy || !ids.length;
  return data;
}

function renderSession(sess) {
  if (!sess) return;
  currentSession = sess.id;
  clearLog();
  const turns = sess.turns || [];
  if (!turns.length) {
    addEvent('step', 'session · ' + (sess.title || 'empty')).textContent = 'no turns yet — type a task below';
    return;
  }
  for (const t of turns) {
    addEvent('step', 'task · ' + fmtWhen(t.started)).textContent = t.task || '';
    for (const ev of t.events || []) handle(ev);
  }
  $('status').textContent = 'session loaded';
}

async function openSession(id) {
  if (!id) return;
  const res = await fetch('/api/sessions/' + encodeURIComponent(id));
  if (!res.ok) {
    addEvent('error', 'session').textContent = 'could not load session ' + id;
    return;
  }
  renderSession(await res.json());
}

async function newSession() {
  if (busy) return;
  const res = await fetch('/api/sessions/new', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}',
  });
  if (!res.ok) { addEvent('error', 'session').textContent = 'could not create a session'; return; }
  const sess = await res.json();
  renderSession(sess);
  await loadSessions(sess.id);
  $('task').value = '';
  $('task').focus();
  $('status').textContent = 'new session';
}

async function deleteSession() {
  const id = $('session-select').value;
  if (busy || !id) return;
  if (!confirm('Delete this saved session?')) return;
  await fetch('/api/sessions/' + encodeURIComponent(id) + '/delete', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}',
  });
  currentSession = null;
  const data = await loadSessions();
  const next = (data.sessions || [])[0];
  if (next) { await openSession(next.id); await loadSessions(next.id); }
  else { clearLog(); $('status').textContent = 'no saved sessions'; }
}

// ---- switch model ------------------------------------------------------
async function switchModel() {
  const id = $('model-select').value;
  if (!id || busy) return;
  const label = (models.find(m => m.id === id) || {}).label || id;
  clearLog();
  setBusy('switch', 'switching model…');
  addEvent('phase', 'switch · unloading').textContent = 'stopping the current model server, then loading ' + label;

  let failed = false, loaded = false;
  try {
    const res = await fetch('/api/switch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: id}),
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status + ' ' + await res.text().catch(() => ''));
    await readSSE(res, (ev) => {
      if (ev.type === 'switch_phase') {
        const pre = addEvent('phase', 'switch · ' + ev.phase);
        pre.textContent = (ev.message || '') + (ev.elapsed ? '  [' + fmtSecs(ev.elapsed) + ' elapsed]' : '');
      } else if (ev.type === 'switch_ready') {
        loaded = true;
        addEvent('final', 'model ready').textContent =
          ev.label + ' — loaded in ' + fmtSecs(ev.seconds) + (ev.note ? ' (' + ev.note + ')' : '');
      } else if (ev.type === 'switch_error') {
        failed = true;
        addEvent('error', 'switch failed').textContent = ev.message
          + '\n\nThe previous model is no longer loaded; pick a model and switch again.';
      }
    });
  } catch (err) {
    failed = true;
    addEvent('error', 'switch failed').textContent = String(err);
  } finally {
    setBusy(false, failed ? 'switch failed' : (loaded ? 'model ready' : 'switch ended'));
    loadInfo().catch(() => {});
  }
}

// ---- run ---------------------------------------------------------------
async function run() {
  const task = $('task').value.trim();
  if (!task || busy) return;
  if (!currentSession) clearLog();
  addEvent('step', 'task').textContent = task;
  busy = true;
  ctrl = new AbortController();
  $('run').disabled = true;
  $('model-select').disabled = true;
  $('switch').disabled = true;
  $('stop').disabled = false;
  $('status').textContent = 'running…';

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        task,
        max_steps: Number($('max-steps').value),
        max_tokens: Number($('max-tokens').value),
        session_id: currentSession,
      }),
      signal: ctrl.signal,
    });
    if (!res.ok || !res.body) {
      const text = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + ' ' + text);
    }
    await readSSE(res, handle);
    $('status').textContent = 'done';
  } catch (err) {
    if (err.name === 'AbortError') {
      addEvent('error', 'stopped').textContent = 'stopped by user';
      $('status').textContent = 'stopped';
    } else {
      addEvent('error', 'error').textContent = String(err);
      $('status').textContent = 'failed';
    }
  } finally {
    ctrl = null;
    setBusy(false, $('status').textContent);
    loadSessions(currentSession).catch(() => {});
  }
}

$('run').addEventListener('click', run);
$('switch').addEventListener('click', switchModel);
$('stop').addEventListener('click', () => { if (ctrl) ctrl.abort(); });
$('model-select').addEventListener('change', () => { $('switch').disabled = busy; });
$('session-select').addEventListener('change', () => {
  openSession($('session-select').value).catch(err => {
    addEvent('error', 'session').textContent = String(err);
  });
});
$('new-session').addEventListener('click', newSession);
$('del-session').addEventListener('click', deleteSession);
$('task').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
});

(async () => {
  try {
    await loadModels();
  } catch (err) {
    $('foot').textContent = 'harness unreachable: ' + err;
  }
  loadInfo();
  // Restore the session this browser left off on (falls back to the newest).
  try {
    const data = await loadSessions();
    const last = data.last || ((data.sessions || [])[0] || {}).id;
    if (last) await openSession(last);
  } catch (err) {
    console.warn('could not restore the last session', err);
  }
})();
</script>
</body>
</html>
